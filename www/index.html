<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08365c">
<title>Fondation Ézéchiel NTAL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="auth">
  <section class="auth-side">
    <div class="plate" style="align-self:flex-start;width:min(300px,100%)"><img id="authLogo" alt="Fondation Ézéchiel NTAL"></div>
    <div>
      <div class="tag">Gestion des activités</div>
      <h1>Fondation Ézéchiel NTAL</h1>
      <p>Une seule application pour le Président, le Secrétaire général, les coordinations, les zones, les cellules et les membres. Chacun voit seulement ce qui le concerne.</p>
    </div>
    <div class="muted" style="font-size:13px;color:var(--side-ink)">Ensemble pour l’avenir, Unis pour le changement</div>
  </section>
  <section class="auth-main"><div class="auth-card">
    <div class="tabs" role="tablist" id="authTabs">
      <button role="tab" data-t="login" aria-selected="true">Connexion</button>
      <button role="tab" data-t="signup" aria-selected="false">Créer un compte</button>
      <button role="tab" data-t="reset" aria-selected="false">Mot de passe oublié</button>
      <button role="tab" data-t="join" aria-selected="false">Demande d'adhésion</button>
    </div>
    <div id="authBody"></div>
  </div></section>
</div>

<div id="app">
  <nav id="side" aria-label="Menu principal"></nav>
  <div id="main">
    <header class="top">
      <button class="btn burger" id="burger" aria-label="Ouvrir le menu">☰</button>
      <div class="grow"><div class="who" id="who"></div><div class="muted" style="font-size:12px" id="whoRole"></div></div>
      <button class="btn sm" id="themeBtn" aria-label="Changer de thème">Thème</button>
      <button class="btn sm" id="logout">Déconnexion</button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="toast" role="status"></div>

<!-- Bibliothèques copiées dans www/vendor par « npm run prepare:web » -->
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/qrcode.js"></script>
<!-- Code de l'application (l'ordre compte) -->
<script src="js/logos.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/views-gestion.js"></script>
<script src="js/views-suivi.js"></script>
<script src="js/main.js"></script>
</body>
</html>
