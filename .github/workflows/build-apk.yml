name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer les dépendances
        run: npm install
      - name: Copier les bibliothèques
        run: npm run prepare:web
      - name: Créer le projet Android
        run: npx cap add android
      - name: Générer les icônes
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
        continue-on-error: true
      - name: Synchroniser
        run: npx cap sync android
      - name: Compiler l'APK de test
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: fen-apk-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
